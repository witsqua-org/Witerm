# Standalone HTTPS deployment. Keep certificates and .env outside version control.
name: witerm

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:-37429}:8443"
    environment:
      HTTP_ADDR: ":8443"
      DATABASE_URL: "postgres://${POSTGRES_USER:-witerm}:${POSTGRES_PASSWORD:?Set a random database password}@postgres:5432/${POSTGRES_DB:-witerm}?sslmode=disable"
      MIGRATE_ON_START: "true"
      TLS_CERT_FILE: /run/tls/fullchain.pem
      TLS_KEY_FILE: /run/tls/privkey.pem
      RELAY_ALLOW_LOOPBACK_DEVELOPMENT: "false"
    volumes:
      - type: bind
        source: ${TLS_DIRECTORY:?Set TLS_DIRECTORY to the certificate directory}
        target: /run/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/witerm-server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-witerm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a random database password}"
      POSTGRES_DB: "${POSTGRES_DB:-witerm}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
