# Optional test runner; used with the main Compose file and the tools profile.
services:
  server-test:
    image: golang:1.26-alpine
    profiles: [tools]
    working_dir: /workspace/server
    volumes:
      - .:/workspace:ro
    environment:
      TEST_DATABASE_URL: "postgres://${POSTGRES_USER:-witerm}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-witerm}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "test", "-count=1", "./..."]

